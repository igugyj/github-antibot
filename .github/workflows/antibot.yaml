name: 'Antibot'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  antibot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Block bot abusers
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ github.actor }}
          # blocks any users with a follwing count above this
          # threshold, consider them as bot abusers.
          ANTIBOT_THRESHOLD: 20000
          # comma separated list of usernames to whitelist (do
          # not block even if above threshold)
          ANTIBOT_WHITELIST: ''
        run: |
          python antibot.py
          uuidgen > .keep_alive
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: Keep alive
