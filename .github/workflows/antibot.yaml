name: 'Antibot'

on:
  workflow_dispatch:
  schedule:
    # Keep in sync with "schedule.cron" in config.json (GitHub Actions only
    # honors the cron declared here). Currently weekly: Sunday 00:00 UTC.
    - cron: '0 0 * * 0'

jobs:
  antibot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Block bot abusers
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: bash scripts/run.sh
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Antibot report + keep alive'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>