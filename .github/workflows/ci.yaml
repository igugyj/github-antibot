name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Tidy dependencies
        run: go mod tidy
      - name: Run tests
        run: go test -race ./...
      - name: Build
        # Build to /dev/null: ./src is a directory, so a default-named
        # executable ("src") would collide with it.
        run: go build -o /dev/null ./src
